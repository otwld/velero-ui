apiVersion: apps/v1
kind: Deployment
metadata:
  name: velero-ui
  namespace: velero-ui
spec:
  selector:
    matchLabels:
      name: velero-ui
  template:
    metadata:
      labels:
        name: velero-ui
    spec:
      serviceAccountName: velero-ui
      containers:
      - name: velero-ui
        image: otwld/velero-ui:latest
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
        startupProbe:
          httpGet:
            path: /health/startup
            port: http
          failureThreshold: 30
          periodSeconds: 10
        env:
          - name: AUTH_SECRET_PASSPHRASE
            valueFrom:
              secretKeyRef:
                name: velero-ui-auth
                key: pass_phrase
          - name: BASIC_AUTH_USERNAME
            valueFrom:
              secretKeyRef:
                name: velero-ui-auth
                key: username
          - name: BASIC_AUTH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: velero-ui-auth
                key: password
          - name: VELERO_UI_NAMESPACE
            value: velero-ui
          - name: POLICY_FILE_PATH
            value: /policies/policies.csv
        volumeMounts:
          - name: policies
            mountPath: "/policies"
            readOnly: true
      volumes:
        - name: policies
          configMap:
            name: velero-ui
            items:
              - key: policies.csv
                path: policies.csv
