{{- if and .Values.configuration.general.secretPassPhrase.useSecret (not .Values.configuration.general.secretPassPhrase.existingSecret)}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "velero-ui.passPhraseSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "velero-ui.labels" . | nindent 4 }}
  {{- with .Values.configuration.general.secretPassPhrase.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ .Values.configuration.general.secretPassPhrase.key }}: {{ required "Set configuration.general.secretPassPhrase.value to a random secret of at least 32 bytes, or configure existingSecret" .Values.configuration.general.secretPassPhrase.value | b64enc | quote }}
{{- end}}
