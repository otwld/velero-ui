name: Lint, test and build

on:
  push:
    branches:
      - main
    paths:
      - apps/**
      - libs/**
      - package.json
      - package-lock.json
      - scripts/dependency-security.test.mjs
      - patches/**
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - apps/**
      - libs/**
      - package.json
      - package-lock.json
      - scripts/dependency-security.test.mjs
      - patches/**
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  NX_BASE: main

jobs:
  main:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npm run test:dependency-security

      - uses: nrwl/nx-set-shas@v4

      - run: npx nx run-many -t test -p velero-ui,velero-ui-api --parallel=2

      - run: npx nx run-many -t lint build
